basePath: /api/v1
definitions:
  agent.agentWriteRequest:
    properties:
      api:
        type: string
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      icon:
        type: string
      model:
        type: string
      reasoning_effort:
        type: string
      sort_order:
        type: integer
      system_prompt:
        type: string
      temperature:
        type: number
      tools:
        items:
          type: string
        type: array
    type: object
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  chat.chatRequest:
    properties:
      conversation_id:
        description: 'optional: absent starts a new conversation'
        type: string
      message:
        type: string
    type: object
  response.Envelope:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: '"Bearers {access token}" (Casdoor-issued JWT).'
  title: fantastic API
  version: 0.1.0
paths:
  /agent-tools:
    get:
      description: 'Sorted names of the runtime tool catalog: the only tools an agent
        may be assigned (spec: Catalog-driven tool assignment). Feeds the admin page''s
        tool checkboxes.'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: List assignable tool names (admin)
      tags:
      - agents
  /agents:
    get:
      description: 'Listing metadata of every agent: display name, description, icon,
        enabled, sort order and degraded tool names. System prompts, tools and overrides
        are never included.'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: List agents (metadata only)
      tags:
      - agents
  /agents/{agent}/chat:
    post:
      consumes:
      - application/json
      description: 'SSE: emits data frames with types stream_chunk, message, tool_result,
        done, error (eino http-sse-service format). The Conversation-Id response header
        carries the conversation id (created on the fly and bound to the path agent
        when the request omits it). Unknown or disabled agents are rejected with 404;
        chatting into a conversation bound to another agent is rejected with 409.'
      parameters:
      - description: agent id (slug)
        in: path
        name: agent
        required: true
        type: string
      - description: message and optional conversation id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chat.chatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Stream one chat turn for an agent
      tags:
      - chat
  /agents/{id}:
    delete:
      description: 'Refused with 409 while conversations still reference the agent;
        disable it (enabled: false) instead.'
      parameters:
      - description: agent id (slug)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Delete an agent (admin)
      tags:
      - agents
    get:
      description: Adds the system prompt, tool assignment and model overrides to
        the listing metadata.
      parameters:
      - description: agent id (slug)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Get agent detail (admin)
      tags:
      - agents
    patch:
      description: 'Only the provided fields change; the rest keeps its current value.
        The id is immutable: the path is authoritative.'
      parameters:
      - description: agent id (slug)
        in: path
        name: id
        required: true
        type: string
      - description: fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.agentWriteRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Update an agent (admin)
      tags:
      - agents
    post:
      description: 'Validated create: the id is the path slug, the system prompt is
        required, every tool name must exist in the runtime catalog. Missing strings
        default empty, enabled defaults true, sort order defaults 0, nil overrides
        inherit the global llm default.'
      parameters:
      - description: agent id (lowercase slug)
        in: path
        name: id
        required: true
        type: string
      - description: agent fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.agentWriteRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Create an agent (admin)
      tags:
      - agents
  /auth/token:
    post:
      consumes:
      - application/json
      description: Password grant proxy to Casdoor; disabled unless auth.dev_token_endpoint
        is true (then the route is absent and returns 404).
      parameters:
      - description: username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Exchange credentials for a token (dev only)
      tags:
      - auth
  /conversations:
    get:
      description: When agent_id is set, only conversations bound to that agent are
        returned.
      parameters:
      - description: filter by bound agent id
        in: query
        name: agent_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: List my conversations
      tags:
      - conversations
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Create a conversation
      tags:
      - conversations
  /conversations/{id}:
    delete:
      parameters:
      - description: conversation id (uuid)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Delete a conversation
      tags:
      - conversations
  /conversations/{id}/messages:
    get:
      description: Flattened user/assistant/tool messages in order, including tool
        calls and their results.
      parameters:
      - description: conversation id (uuid)
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Get conversation messages
      tags:
      - conversations
  /whoami:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - bearerAuth: []
      summary: Who am I
      tags:
      - auth
swagger: "2.0"
