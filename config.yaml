# fantastic configuration.
# Secrets are referenced with ${VAR} braces and resolved from the environment at load.

server:
  http_port: 5580

database:
  # Local compose Postgres (pgvector), host port from .env (default 5555).
  url: ${DATABASE_URL}

llm:
  base_url: https://api.openai.com/v1   # swap to any OpenAI-compatible gateway
  # "responses" (/v1/responses, default) is required for reasoning models
  # with function tools such as gpt-6.1-sol; "chat" (/v1/chat/completions)
  # suits classic models on gateways without a responses endpoint.
  api: responses
  model: gpt-6.1-sol
  api_key_env: OPENAI_API_KEY
  # system_prompt: "You are..."
  # Reasoning models reject temperature — leave 0 to omit the parameter.
  temperature: 0
  max_tokens: 2048
  # Reasoning effort on /responses: low/medium/high/xhigh. Empty = default.
  reasoning_effort: ""

memory:
  history_window: 20

# FAQ RAG (formalized by task 4.3; embedding/search keys unchanged since 2.2/2.4).
faq:
  embedding:
    model: text-embedding-3-small
    # Vector dimension of the model (design D2: a vector column is a
    # (model, dimension) pair — a new model means a new column, not this).
    dims: 1536
    # Optional OpenAI-compatible gateway; empty = OpenAI default endpoint.
    base_url: ""
    # Resolved from the environment at load — no literal secrets here.
    api_key: ${OPENAI_API_KEY}
  search:
    # How many FAQ chunks the search_faq tool returns at most (design D7;
    # validated range 1..20).
    top_k: 5
  scrape:
    # Politeness policy (design D6): only these hosts are ever fetched.
    allowed_hosts:
      - linkaja.id
      - www.linkaja.id
    # Milliseconds between requests; the default keeps cadence at >=1 req/s.
    request_delay_ms: 1000
    # User-Agent sent with every scrape request (design D6 contract string).
    user_agent: "fantastic-faq-spike/0.1 (personal project; contact via repo)"
    # Raw HTML cache so re-embedding never re-crawls (design D5; gitignored).
    cache_dir: data/raw
  corpus:
    # Committed JSON corpus artifact (design D5).
    path: data/corpus/linkaja-faq.json
    # Per-chunk hash integrity manifest emitted by the index step.
    manifest_path: data/corpus/index-manifest.json

auth:
  issuer: http://localhost:5560
  client_id: fantastic-app
  organization: pribadi
  jwks_url: http://localhost:5560/.well-known/jwks
  dev_token_endpoint: true
  client_secret_env: CASDOOR_CLIENT_SECRET
  # Casdoor roles (from the token's `roles` claim) allowed to manage
  # agents (design D6). Defaults to [fantastic-admin] when omitted.
  admin_roles:
    - fantastic-admin

mcp_servers:
  tebar:
    url: https://api.tebar.app/mcp
    headers:
      Authorization: "Bearer ${TEBAR_MCP_TOKEN}"
    allow_tools:
      - list_accounts
      - get_platform_rules
      - get_publishing_limits
      - list_posts
      - get_post
      - list_comments

# Agent seeds (design D8): declarative rows inserted at startup with
# ON CONFLICT (id) DO NOTHING — agents edited through the API/DB always
# win over this file, and a hand-emptied table reseeds on restart. The map
# key is the agent id (slug, lowercase letters/digits/hyphens): it appears
# in the chat URL and conversations.agent_id and is immutable once created.
agents:
  general:
    display_name: General Assistant
    description: Default assistant; answers LinkAja questions from the FAQ knowledge base.
    icon: assistant
    tools:
      - search_faq
    # Optional per-agent overrides; unset keys inherit the global llm block
    # ("leave 0 to omit" applies to temperature, as in llm).
    # model: gpt-6.1-sol
    # api: responses
    # temperature: 0
    # reasoning_effort: ""
    enabled: true
    sort_order: 0
    # Canonical FAQ-answer prompt — keep in sync with PromptAddendum in
    # internal/adapters/tools/faq/tool.go (migration 0005 bakes the same
    # rules into the seeded general row).
    system_prompt: |
      FAQ answering rules (search_faq tool):
      - Answer in the user's language; Indonesian by default.
      - For any question about LinkAja (products, features, fees, how-tos, account matters), call search_faq BEFORE answering and answer from its results.
      - When you answer from search_faq results, cite the linkaja.id source_url of the snippet(s) you used.
      - Only cite source URLs returned by search_faq — never invent or alter links.
      - If search_faq returns no relevant results, say that the FAQ knowledge base does not cover it; do not present your own knowledge as if it came from the FAQ.
